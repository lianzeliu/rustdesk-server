name: build-binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build hbbs/hbbr (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build hbbs
        run: cross build --release --bin hbbs --target ${{ matrix.target }}

      - name: Build hbbr
        run: cross build --release --bin hbbr --target ${{ matrix.target }}

      - name: Upload hbbs
        uses: actions/upload-artifact@v4
        with:
          name: hbbs-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/hbbs

      - name: Upload hbbr
        uses: actions/upload-artifact@v4
        with:
          name: hbbr-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/hbbr

      - name: Find and upload libgcc_s
        run: |
          LIBGCC=$(find / -name "libgcc_s.so.1" -path "*aarch64*" 2>/dev/null | head -1)
          if [ -z "$LIBGCC" ] && [ "${{ matrix.arch }}" = "x86_64" ]; then
            LIBGCC=$(find / -name "libgcc_s.so.1" -path "*x86_64*" 2>/dev/null | head -1)
          fi
          echo "Found: $LIBGCC"
          mkdir -p /tmp/libgcc && cp "$LIBGCC" /tmp/libgcc/ || echo "not found"
        continue-on-error: true

      - name: Upload libgcc_s
        uses: actions/upload-artifact@v4
        with:
          name: libgcc_s-${{ matrix.arch }}
          path: /tmp/libgcc/
        continue-on-error: true
