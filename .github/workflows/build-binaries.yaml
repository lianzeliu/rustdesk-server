name: build-binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build hbbs/hbbr (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build hbbs
        run: cargo build --release --bin hbbs --target ${{ matrix.target }}

      - name: Build hbbr
        run: cargo build --release --bin hbbr --target ${{ matrix.target }}

      - name: Upload hbbs
        uses: actions/upload-artifact@v4
        with:
          name: hbbs-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/hbbs

      - name: Upload hbbr
        uses: actions/upload-artifact@v4
        with:
          name: hbbr-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/hbbr
